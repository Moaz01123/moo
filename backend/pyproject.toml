[project]
name = "kavo-backend"
version = "0.1.0"
description = "KAVO streetwear ecommerce backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "passlib>=1.7.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]
